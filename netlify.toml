[build]
  command = "node -v && npm install && npx expo export --platform web"
  publish = "dist"

# Single-page application (SPA) routing
# This ensures that deep links work on the web
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  EXPO_PUBLIC_API_URL = "https://your-backend-url.com/api"
